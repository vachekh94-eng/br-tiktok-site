<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0B0B10">
<title>BR — скачать видео из TikTok без водяного знака</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="glow"></div>

  <header class="header">
    <div class="logo">BR</div>
    <p class="tag">видео из TikTok, без водяного знака</p>
  </header>

  <main class="main">
    <div class="hint">
      <span class="hint-emoji">🤙</span>
      <p>Вставь ссылку на видео — заберём его чистым, без вотермарки.</p>
    </div>
  </main>

  <footer class="footer">
    <form id="downloadForm" class="form" autocomplete="off">
      <input
        id="tiktokUrl"
        type="url"
        inputmode="url"
        placeholder="https://www.tiktok.com/@..."
        required
      >
      <button id="downloadBtn" type="submit">Скачать</button>
    </form>

    <div id="progressWrap" class="progress-wrap" hidden>
      <div id="progressEmojis" class="progress-emojis"></div>
      <div class="progress-percent"><span id="progressPercent">0</span>%</div>
    </div>

    <a id="fileLink" class="file-link" hidden download>Сохранить файл 🤙</a>

    <p id="errorMsg" class="error" hidden></p>
  </footer>

<script src="script.js"></script>
</body>
</html>
